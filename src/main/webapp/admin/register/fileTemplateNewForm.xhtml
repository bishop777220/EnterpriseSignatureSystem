<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:p="primefaces">

    <body>

        <ui:composition template="./../../masterpages/baseMasterV1.xhtml">

            <ui:define name="title">
                Создание шаблона файла
            </ui:define>

            <ui:define name="top">
                Создание шаблона файла
            </ui:define>

            <ui:define name="content">
                <f:view>


                    <h:form>
                        <p:card title="Создание директория назначения">
                            <div class="itemBloc">
                                <div class="lable"><p:outputLabel value="Регистр:"  /></div>
                                <div class="body"><p:outputLabel value="#{reestrViewBean.fileTemplate.documentType.register.title}" /></div>
                                <div class="validatorMessage"></div>
                                <small class="block"></small>
                            </div>
                            <div class="itemBloc">
                                <div class="lable"><p:outputLabel value="DocumentType:"  /></div>
                                <div class="body"><p:outputLabel value="#{reestrViewBean.fileTemplate.documentType.title}" /></div>
                                <div class="validatorMessage"></div>
                                <small class="block"></small>
                            </div>
                            <div class="itemBloc">
                                <div class="lable"><p:outputLabel value="Title:" for="title" /></div>
                                <div class="body"><p:inputText id="title" value="#{reestrViewBean.fileTemplate.title}" title="Title" /></div>
                                <div class="validatorMessage"></div>
                                <small class="block"></small>
                            </div>
                            <div class="itemBloc">
                                <div class="lable"><p:outputLabel value="Description:" for="description" /></div>
                                <div class="body"><p:inputTextarea rows="6" id="description" value="#{reestrViewBean.fileTemplate.description}" title="Description" /></div>
                                <div class="validatorMessage"></div>
                                <small class="block"></small>
                            </div>
                            <div class="itemBloc">
                                <div class="lable"><p:outputLabel value="Маска названия файла:" for="fileMask" /></div>
                                <div class="body"><p:inputText id="fileMask" value="#{reestrViewBean.fileTemplate.fileMask}" title="FileMask" /></div>
                                <div class="validatorMessage"></div>
                                <small class="block">Маска названия файла в формате REGEX</small>
                            </div>
                            <div class="itemBloc">
                                <div class="lable"><p:outputLabel value="Обязательный в наборе:" for="required" /></div>
                                <div class="body">
                                    <p:selectBooleanButton id="required" value="#{reestrViewBean.fileTemplate.required}"
                                                           onLabel="Да" offLabel="Нет" 
                                                           onIcon="pi pi-check" offIcon="pi pi-times"   
                                                           title="required" />
                                </div>
                                <div class="validatorMessage"></div>
                                <small class="block"> Указывает что фальл обязательный в наборе данного вида</small>
                            </div>
                            <div class="itemBloc">
                                <div class="lable"><p:outputLabel value="Не подписыается:" for="notSignable" /></div>
                                <div class="body">
                                    <p:selectBooleanButton id="notSignable" value="#{reestrViewBean.fileTemplate.notSignable}"
                                                           onLabel="Да" offLabel="Нет" 
                                                           onIcon="pi pi-check" offIcon="pi pi-times"   
                                                           title="NotSignable" />
                                </div>
                                <div class="validatorMessage"></div>
                                <small class="block">Указывает что фальл не подписыается</small>
                            </div>

                            <f:facet name="footer" >
                                <p:divider/>
                                <div style="text-align: right;">
                                    <p:commandButton icon="pi pi-check" value="Сохранитть" update="@form" action="#{reestrViewBean.createFileTemplate('/admin/register/registerDispForm')}"/>
                                    <p:commandButton icon="pi pi-times" value="Отмена" styleClass="ui-button-secondary" style="margin-left: .5em"/>
                                </div>
                            </f:facet>

                        </p:card>

                    </h:form>
                </f:view>

            </ui:define>

        </ui:composition>

    </body>
</html>
