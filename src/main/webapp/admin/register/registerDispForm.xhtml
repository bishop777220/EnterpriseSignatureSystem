<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:p="http://primefaces.org/ui">

    <body>

        <ui:composition template="./../../masterpages/baseMasterV1.xhtml">

            <ui:define name="title">
                ${reestrViewBean.register.title}
            </ui:define>

            <ui:define name="top">
                ${reestrViewBean.register.title}
            </ui:define>

            <ui:define name="content">
                <f:view>


                    <h:form>
                        <p:tabView  cache="true" >
                            <p:tab title="Регистр">
                                <p:card title="${reestrViewBean.register.title}">
                                    <div class="itemBloc">
                                        <div class="lable"><p:outputLabel value="Наименование:" /></div>
                                        <div class="body"><p:outputLabel value="#{reestrViewBean.register.title}" title="Title"/></div>
                                        <small class="block"></small>
                                    </div>
                                    <div class="itemBloc">
                                        <div class="lable"><p:outputLabel value="Полное наименование:"/></div>
                                        <div class="body"><p:outputLabel value="#{reestrViewBean.register.fullName}" title="FullName"/></div>
                                        <small class="block"></small>
                                    </div>
                                    <div class="itemBloc">
                                        <div class="lable"><p:outputLabel value="Описание:"/></div>
                                        <div class="body"><p:outputLabel value="#{reestrViewBean.register.description}" title="Description"/></div>
                                        <small class="block"></small>
                                    </div>
                                    <div class="itemBloc">
                                        <div class="lable"><p:outputLabel value="Реестр являетья списком документов дня:"  /></div>
                                        <div class="body"><p:selectBooleanButton id="isDayTimeDocuments" value="#{reestrViewBean.register.isDayTimeDocuments}"
                                                                                 onLabel="Да" offLabel="Нет" 
                                                                                 onIcon="pi pi-check" offIcon="pi pi-times"   
                                                                                 title="isDayTimeDocuments"
                                                                                 disabled="true"/></div>
                                        <small class="block"></small>
                                    </div>
                                    <div class="itemBloc">
                                        <div class="lable"><p:outputLabel value="Маска формата даты:"/></div>
                                        <div class="body"><p:outputLabel value="#{reestrViewBean.register.dateFolderMask}" title="DateFolderMask"/></div>
                                        <small class="block"></small>
                                    </div>
                                    <div class="itemBloc">
                                        <div class="lable"><p:outputLabel value="Разрешить отправлять по одному виду документа:"/></div>
                                        <div class="body"><p:selectBooleanButton id="sendOneByOne" value="#{reestrViewBean.register.sendOneByOne}" 
                                                                                 onLabel="Да" offLabel="Нет" 
                                                                                 onIcon="pi pi-check" offIcon="pi pi-times"  
                                                                                 title="SendOneByOne" 
                                                                                 disabled="true"/></div>
                                        <small class="block"></small>
                                    </div>
                                    <div class="itemBloc">
                                        <div class="lable"></div>
                                        <div class="body"></div>
                                        <small class="block"></small>
                                    </div>

                                    <p:divider/>
                                    <table width="100%" class="card-footer">
                                        <tr>
                                            <td>
                                                <div>
                                                    <b>Создано: </b>
                                                    <p:outputLabel value="#{reestrViewBean.register.created}" title="Created">
                                                        <f:convertDateTime type="localDateTime" pattern="dd.MM.yyyy HH:mm" />
                                                    </p:outputLabel>
                                                    <b> Кем создано: </b>
                                                    <p:outputLabel value="#{reestrViewBean.register.createdBy.fullName}" title="CreatedBy"/>
                                                </div>
                                                <div>
                                                    <b>Изменено: </b>
                                                    <p:outputLabel value="#{reestrViewBean.register.updated}" title="Updated">
                                                        <f:convertDateTime type="localDateTime" pattern="dd.MM.yyyy HH:mm" />
                                                    </p:outputLabel>
                                                    <b> Кем изменено: </b>
                                                    <p:outputLabel value="#{reestrViewBean.register.updatedBy.fullName}" title="UpdatedBy"/>
                                                </div>
                                                <div>
                                                    <b>Версия: </b>
                                                    <p:outputLabel value="#{reestrViewBean.register.version}" title="Version"/>
                                                </div>
                                            </td>
                                        </tr>
                                    </table>

                                    <p:divider/>


                                </p:card>

                                <f:facet name="actions">
                                    <p:menuButton>
                                        <p:menuitem value="Изменить" outcome="/admin/register/registerEditForm" >
                                            <f:param name="rID" value="#{reestrViewBean.register.id}" />
                                        </p:menuitem>
                                    </p:menuButton>
                                </f:facet>

                            </p:tab>

                            <p:tab title="Директории источники">
                                <p:dataTable value="#{reestrViewBean.register.sourceSet}" var="source">
                                    <p:column headerText="Наименование">

                                        <p:link value="#{source.title}" style="display: block" outcome="/admin/register/sourceEditForm">
                                            <f:param name="sID" value="#{source.id}" />
                                        </p:link>
                                    </p:column>
                                    <p:column headerText="Путь">
                                        #{source.path}
                                    </p:column>

                                    <p:column width="50">
                                        <p:commandButton icon="pi pi-times" update="@form" async="true" action="#{reestrViewBean.removeSource(source, '/admin/register/registerDispForm')}" />
                                    </p:column>

                                </p:dataTable>


                                <f:facet name="actions">
                                    <p:menuButton>
                                        <p:menuitem value="Добавить директорию источник" outcome="/admin/register/sourceNewForm" >
                                            <f:param name="rID" value="#{reestrViewBean.register.id}" />
                                        </p:menuitem>
                                    </p:menuButton>
                                </f:facet>

                            </p:tab>

                            <p:tab title="Директории назначения">
                                <p:dataTable value="#{reestrViewBean.register.destinationSet}" var="destination">
                                    <p:column headerText="Наименование">

                                        <p:link value="#{destination.title}" style="display: block" outcome="/admin/register/destinationEditForm">
                                            <f:param name="destID" value="#{destination.id}" />
                                        </p:link>
                                    </p:column>
                                    <p:column headerText="Путь">
                                        #{destination.path}
                                    </p:column>

                                    <p:column width="50">
                                        <p:commandButton icon="pi pi-times" update="@form" async="true" action="#{reestrViewBean.removeDestination(destination, '/admin/register/registerDispForm')}" />
                                    </p:column>

                                </p:dataTable>


                                <f:facet name="actions">
                                    <p:menuButton>
                                        <p:menuitem value="Добавить директорию назначения" outcome="/admin/register/destinationNewForm" >
                                            <f:param name="rID" value="#{reestrViewBean.register.id}" />
                                        </p:menuitem>
                                    </p:menuButton>
                                </f:facet>
                            </p:tab>

                            <p:tab title="Виды комплектов">
                                <ui:repeat value="#{reestrViewBean.register.documentTypeSet}" var="documentType" >

                                    <p:panel header="#{documentType.title}" style="margin: 20px" footer="#{documentType.recursive ? 'Учавствовать вложенные директории' : 'Только содержимое текущей директории'}" 
                                             toggleable="true">
                                        <h4>Пути к директориям:</h4>

                                        <ui:repeat value="#{documentType.getFullSourcePath(null)}" var="path">
                                            <div>
                                                <p:outputLabel value="#{path}" />
                                            </div>
                                        </ui:repeat>

                                        <h4>Шаблоны файлов:</h4>
                                        <p:dataTable value="#{documentType.fileTemplateList}" var="fileTemplate">
                                            <p:column headerText="Наименование">
                                                #{fileTemplate.title}
                                            </p:column>

                                            <p:column headerText="Маска файла">
                                                #{fileTemplate.fileMask}
                                            </p:column>

                                            <p:column headerText="Обязательный">
                                                #{fileTemplate.required}
                                            </p:column>

                                            <p:column headerText="Не подписываеться">
                                                #{fileTemplate.notSignable}
                                            </p:column>                                           

                                            <p:column headerText="Не подписываеться">
                                                <p:menuButton icon="pi pi-cog" styleClass="ui-button-outlined">
                                                    <p:menuitem value="Удалить" update="@form" action="#{fileTemplateViewController.removeFileTemplate(fileTemplate)}" />
                                                </p:menuButton>
                                            </p:column> 

                                        </p:dataTable>

                                        <f:facet name="options">
                                            <p:menu>
                                                <p:submenu label="Settings">
                                                    <p:menuitem value="Создать шаблон документа"  outcome="/admin/register/fileTemplateNewForm">
                                                        <f:param name="dtID" value="#{documentType.id}" />
                                                    </p:menuitem>
                                                    <p:divider/>
                                                    <p:menuitem value="Изменить вид документа"  outcome="/admin/register/documentTypeEditForm">
                                                        <f:param name="dtID" value="#{documentType.id}" />
                                                    </p:menuitem>
                                                                                                        
                                                    <p:menuitem value="Удалить вид документа" action="#{documentTypeViewController.removeDocumentType(documentType)}"   >
                                                        <f:param name="dtID" value="#{documentType.id}" />
                                                    </p:menuitem>
                                                </p:submenu>
                                            </p:menu>
                                        </f:facet>
                                        
                                    </p:panel>
                                </ui:repeat>



                                <f:facet name="actions">
                                    <p:menuButton>
                                        <p:menuitem value="Добавить вид документа" outcome="/admin/register/documentTypeNewForm" >
                                            <f:param name="rID" value="#{reestrViewBean.register.id}" />
                                        </p:menuitem>
                                        
                                    </p:menuButton>
                                </f:facet>
                            </p:tab>
                            
                           
                            <p:tab title="Последовательность подписания">
                                
                            </p:tab>
                            
                            <p:tab title="Роли и участники">
                                
                            </p:tab>
                        </p:tabView>
                    </h:form>
                </f:view>

            </ui:define>

        </ui:composition>

    </body>
</html>
